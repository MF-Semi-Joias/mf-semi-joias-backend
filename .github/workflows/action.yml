name: CI/CD Pipeline

on:
  push:
    branches:
      - '**' # Aciona em qualquer branch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean install

      - name: Run tests
        run: mvn test

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: alterações automatizadas" || echo "Nada para commitar"

      - name: Push changes to develop
        run: |
          git fetch origin
           git checkout develop
           git merge ${{ github.ref_name }} --no-ff --allow-unrelated-histories -m "Merge branch '${{ github.ref_name }}' into develop"
           git push origin develop